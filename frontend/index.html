  <script>

       requested explicitly from the admin panel so regular site visitors are never asked. -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];

  <link rel="manifest" href="/static/manifest.json" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: #020810;
      color: #fff;
      font-family: 'Space Grotesk', sans-serif;
      overflow-x: hidden;
    }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(50,114,168,0.3); border-radius: 2px; }
    input, textarea, select, button { font-family: 'Space Grotesk', sans-serif; }
    .admin-tabbar::-webkit-scrollbar { display: none; }
    @media (min-width: 681px) { .admin-tabbar { flex-wrap: wrap; } }

    @keyframes btnGlow {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }
    @keyframes logoGlow {
      from { filter: drop-shadow(0 0 20px rgba(50,114,168,0.6)) drop-shadow(0 0 40px rgba(6,182,212,0.3)); }
      to   { filter: drop-shadow(0 0 40px rgba(50,114,168,1))   drop-shadow(0 0 80px rgba(6,182,212,0.6)) drop-shadow(0 0 120px rgba(99,102,241,0.4)); }
    }
    /* Deliberately animates only opacity, not transform: an animated transform
       (even one that ends at an identity value) makes this element a permanent
       containing block for any position:fixed descendant — which broke every
       full-screen modal rendered inside <main class="page-enter">. */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    @keyframes starShimmer {
      0%   { background-position: -200% center; }
      100% { background-position: 200% center; }
    }
    @keyframes badgeTwinkle {
      0%, 100% { opacity: 0.35; transform: scale(0.7); }
      50%      { opacity: 1;    transform: scale(1.15); }
    }
    /* Prevent body scroll whenever any modal is open */
    body:has(.modal-overlay) { overflow: hidden; }
    .modal-overlay { touch-action: none; }
    .modal-sheet   {
      touch-action: pan-y;
      overscroll-behavior: contain;
      max-height: 88vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    @media (max-width: 680px) {
      .modal-overlay {
        padding: 20px !important;
        align-items: center !important;
      }
      .modal-sheet {
        width: 100% !important;
        max-width: 420px !important;
        margin: 0 auto !important;
        padding: 20px 16px 28px !important;
        box-sizing: border-box !important;
      }
      .name-row { grid-template-columns: 1fr !important; }
    }
    .page-enter { animation: fadeIn 0.35s ease forwards; }

    /* ── Admin on phones ──────────────────────────────────────────────────────
       The admin panel is built desktop-first with inline styles, so these overrides
       need !important. Tables become labelled cards (labels come from useTableCellLabels). */
    @media (max-width: 680px) {
      .adm-root { padding: 80px 14px 110px !important; }
      .adm-header > div { margin-bottom: 12px !important; }
      .adm-header h2 { font-size: 20px !important; }
      .adm-header p { font-size: 12px !important; margin-top: 4px !important; }

      /* Tab bar sticks under the top nav so switching sections never means scrolling back up */
      .admin-tabbar {
        position: sticky; top: 72px; z-index: 50;
        margin: 0 -14px 18px !important; padding: 0 6px !important;
        background: rgba(4,8,18,0.96); backdrop-filter: blur(14px);
        -webkit-mask-image: linear-gradient(90deg, #000 88%, transparent);
                mask-image: linear-gradient(90deg, #000 88%, transparent);
      }
      .admin-tabbar button { padding: 14px 12px !important; font-size: 12px !important; }

      /* 16px stops iOS Safari zooming the page on every field tap */
      .adm-root input:not([type=checkbox]):not([type=radio]), .adm-root select, .adm-root textarea,
      .modal-sheet input:not([type=checkbox]):not([type=radio]), .modal-sheet select, .modal-sheet textarea {
        font-size: 16px !important; max-width: 100%;
      }
      .adm-root input:not([type=checkbox]):not([type=radio]):not([type=file]), .adm-root select { min-height: 44px; }
      .adm-root input[type=checkbox] { width: 20px !important; height: 20px !important; }

      /* Toolbars of filters/buttons: full-width search and selects instead of odd fixed widths */
      .adm-root select, .adm-root input[placeholder*="earch"] { width: 100% !important; min-width: 0 !important; flex: 1 1 100% !important; }
      .adm-root button, .adm-root a { -webkit-tap-highlight-color: transparent; }
      .adm-root div:has(> input[placeholder*="earch"]) { flex-wrap: wrap; }

      /* Long emails / names wrap instead of pushing things off-screen */
      .adm-root { overflow-wrap: anywhere; }

      /* Tables → cards */
      .adm-root div:has(> table) { overflow: visible !important; background: rgba(6,12,26,0.92) !important; }
      .adm-root table, .adm-root tbody, .adm-root tr, .adm-root td { display: block; width: 100% !important; }
      .adm-root thead { display: none; }
      .adm-root tbody tr {
        position: relative; padding: 14px 14px 12px;
        border-bottom: 1px solid rgba(255,255,255,0.08) !important; background: transparent !important;
      }
      .adm-root td {
        display: flex !important; flex-wrap: wrap; align-items: baseline; gap: 2px 10px;
        padding: 3px 0 !important; border: none !important; text-align: left !important;
        white-space: normal !important; font-size: 13px !important; min-height: 0 !important;
      }
      .adm-root td[data-label]:not([data-label=""])::before {
        content: attr(data-label); flex: 0 0 92px;
        font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase;
        color: rgba(255,255,255,0.35);
      }
      .adm-root td:empty { display: none !important; }
      /* First column is the row's title */
      .adm-root td:first-child { font-size: 15px !important; font-weight: 700; color: #fff !important; padding-bottom: 6px !important; padding-right: 36px !important; }
      .adm-root td:first-child::before { display: none !important; }
      /* Row checkbox column (waitlist) floats top-right; the next column becomes the title */
      .adm-root td:first-child:has(> input[type=checkbox]) { position: absolute; top: 12px; right: 12px; width: auto !important; padding: 0 !important; }
      .adm-root td:first-child:has(> input[type=checkbox]) + td { font-size: 15px !important; font-weight: 700; color: #fff !important; padding-right: 36px !important; }
      .adm-root td:first-child:has(> input[type=checkbox]) + td::before { display: none !important; }
      .adm-root td:first-child:empty + td { font-size: 15px !important; font-weight: 700; color: #fff !important; padding-bottom: 6px !important; }
      .adm-root td:first-child:empty + td::before { display: none !important; }
      /* Action cells: full row of proper thumb-sized buttons */
      .adm-root td:has(button), .adm-root td:has(select) { gap: 8px; padding-top: 10px !important; }
      .adm-root td:has(button)::before { display: none !important; }
      .adm-root td button { min-height: 40px; padding: 8px 14px !important; font-size: 12px !important; flex: 1 1 auto; }

      /* Inbox: one pane at a time — the list, or the open message */
      .inbox-toolbar > div:last-child { margin-left: auto; }
      .inbox-panel { flex-direction: column; min-height: 0 !important; }
      .inbox-list { width: 100% !important; max-height: none !important; border-right: none !important; }
      .inbox-view { padding: 16px !important; max-height: none !important; }
      .inbox-panel[data-open="0"] .inbox-view { display: none; }
      .inbox-panel[data-open="1"] .inbox-list { display: none; }
      .inbox-back { display: block !important; }
      .inbox-view iframe { min-height: 420px !important; }

      /* Stat tiles: tighter, and plain counts go three-across so the numbers fit on one screen */
      .adm-root [style*="display: grid"] { gap: 10px !important; }
      .adm-stat { padding: 12px 12px !important; }
      .adm-counts { grid-template-columns: repeat(3, minmax(0, 1fr)) !important; margin-bottom: 24px !important; }
      .adm-counts .adm-stat > div:first-child { font-size: 24px !important; }
      .adm-counts .adm-stat > div:last-child { font-size: 9px !important; letter-spacing: 0.06em !important; }
      .ads-range > span:first-child { flex-basis: 100%; }
      .ads-range input { flex: 1 1 0; min-width: 0; }
      .ads-range button { min-height: 44px; padding: 0 16px !important; }

      /* Modals become bottom sheets above both nav bars. Pages render inside <main>'s stacking
         context (z-index 1), so a modal can't out-rank the fixed navs — hide them while one is open. */
      body:has(.modal-overlay) nav, body:has(.modal-overlay) .mobile-nav { display: none !important; }
      .modal-overlay { padding: 0 !important; align-items: flex-end !important; }
      .modal-sheet, .modal-overlay > div[style*="max-width"] {
        max-width: 100% !important; width: 100% !important; max-height: 92dvh !important; overflow-y: auto !important;
        border-left: none !important; border-right: none !important; border-bottom: none !important;
        padding: 18px 16px calc(24px + env(safe-area-inset-bottom)) !important;
      }
      /* Title + close stay pinned while a long form scrolls */
      .modal-head {
        position: sticky; top: -18px; z-index: 5;
        margin: -18px -16px 16px !important; padding: 16px 16px 12px;
        background: #040c18; border-bottom: 1px solid rgba(255,255,255,0.06);
      }
      .modal-head h3 { font-size: 16px !important; }
      .modal-head button { font-size: 28px !important; min-width: 44px; min-height: 44px; margin-right: -10px; }
      .modal-sheet button[type=submit] { min-height: 48px; }
      .adm-btnrow { width: 100%; }
      .adm-btnrow > button { flex: 1 1 auto; min-height: 40px; }
      .modal-sheet [style*="grid-template-columns: 1fr 1fr"] { grid-template-columns: 1fr !important; }
    }

    nav {
      position: fixed; top: 0; left: 0; right: 0; z-index: 100;
      height: 72px;
      background: rgba(5,3,16,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      box-shadow: 0 8px 32px rgba(0,0,0,0.35);
      display: grid; grid-template-columns: 1fr auto 1fr; align-items: center;
      padding: 0 28px;
    }
    /* Glowing seam under the whole bar, on top of the plain border for a bit of signature colour */
    nav::after {
      content: '';
      position: absolute; left: 0; right: 0; bottom: -1px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(50,114,168,0.65), rgba(159,132,178,0.4), transparent);
    }
    .nav-logo { display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .nav-logo img { height: 48px; filter: drop-shadow(0 0 8px rgba(50,114,168,0.7)) drop-shadow(0 0 16px rgba(6,182,212,0.4)); transition: filter 0.25s ease, transform 0.25s ease; }
    .nav-logo:hover img { transform: scale(1.06); filter: drop-shadow(0 0 14px rgba(50,114,168,0.9)) drop-shadow(0 0 28px rgba(6,182,212,0.55)); }
    /* Segmented "pill" control instead of bare text links */
    .nav-links {
      display: flex; align-items: center; gap: 2px; justify-content: center;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 999px;
      padding: 5px;
      backdrop-filter: blur(10px);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.05), 0 4px 16px rgba(0,0,0,0.25);
    }
    .nav-link {
      background: none; border: none; cursor: pointer;
      font-size: 13px; font-weight: 600;
      letter-spacing: 0.07em; text-transform: uppercase;
      padding: 9px 18px;
      border-radius: 999px;
      color: rgba(255,255,255,0.55);
      transition: color 0.25s ease, background 0.25s ease, box-shadow 0.25s ease;
    }
    .nav-link:hover { color: #fff; background: rgba(255,255,255,0.08); }
    .nav-link.active {
      color: #fff;
      background: linear-gradient(135deg, #3272a8, #9f84b2);
      box-shadow: 0 0 20px rgba(50,114,168,0.5), inset 0 1px 0 rgba(255,255,255,0.25);
    }
    .nav-right { justify-self: end; display: flex; align-items: center; gap: 10px; }
    .nav-user-badge { display: flex; align-items: center; gap: 8px; font-size: 13px; color: rgba(255,255,255,0.6); }
    .nav-user-dot { width: 8px; height: 8px; border-radius: 50%; background: #3272a8; box-shadow: 0 0 8px rgba(50,114,168,0.8); }

    .mobile-nav {
      display: none;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
      background: rgba(5,3,16,0.95);
      border-top: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
      padding: 10px 0 16px;
    }
    .mobile-nav-inner { display: flex; justify-content: space-around; align-items: center; }
    .mobile-nav-item {
      display: flex; flex-direction: column; align-items: center; gap: 4px;
      background: none; border: none; cursor: pointer;
      border-radius: 14px;
      color: rgba(255,255,255,0.4);
      font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase;
      padding: 6px 10px; transition: color 0.2s ease, transform 0.2s ease, background 0.2s ease, box-shadow 0.2s ease;
    }
    .mobile-nav-item.active {
      color: #fff; transform: translateY(-2px);
      background: linear-gradient(135deg, rgba(50,114,168,0.35), rgba(159,132,178,0.22));
      box-shadow: 0 0 16px rgba(50,114,168,0.35);
    }
    .mobile-nav-item .icon { font-size: 20px; line-height: 1; transition: filter 0.2s ease; }
    .mobile-nav-item.active .icon { filter: drop-shadow(0 0 6px rgba(50,114,168,0.9)); }

    @media (max-width: 680px) {
      nav .nav-links { display: none; }
      nav .nav-right { display: none; }
      .mobile-nav { display: block; }
      body { padding-bottom: 70px; }
    }

    input:-webkit-autofill,
    input:-webkit-autofill:hover,
    input:-webkit-autofill:focus,
    textarea:-webkit-autofill,
    textarea:-webkit-autofill:hover,
    textarea:-webkit-autofill:focus {
      -webkit-box-shadow: 0 0 0 1000px rgba(5,12,28,0.95) inset !important;
      box-shadow: 0 0 0 1000px rgba(5,12,28,0.95) inset !important;
      -webkit-text-fill-color: #fff !important;
      caret-color: #fff;
      border-color: rgba(255,255,255,0.15) !important;
      transition: background-color 600000s 0s, color 600000s 0s;
    }

    /* Hidden video for background audio — keeps playing when off-screen */
    #bg-video {
      position: fixed;
      top: -9999px; left: -9999px;
      width: 1px; height: 1px;
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
<div id="root"></div>

<!-- Persistent background audio video element -->
<video id="bg-video" playsinline webkit-playsinline preload="metadata"></video>

<script src="/static/api.js"></script>
<script src="/static/auth.js"></script>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" crossorigin="anonymous"></script>
<script src="/static/jsqr.js"></script>

<script src="/static/ui.jsx"></script>
<script src="/static/pages.jsx"></script>
<script src="/static/admin_pages.jsx"></script>

<script>
var { useState, useEffect, useRef, useCallback } = React;

const NAV_ITEMS = [
  { id: 'home',    label: 'Home',    icon: '⌂' },
  { id: 'events',  label: 'Events',  icon: '◈' },
  { id: 'mixes',   label: 'Mixes',   icon: '♫' },
  { id: 'tickets', label: 'Tickets', icon: '◉' },
  { id: 'contact', label: 'Contact', icon: '✦' },
];

// /qr/{code} — public discount link (QR codes). Behaves exactly like /buy, plus the discount while it's switched on.
const QR_PATH = /^\/qr\/([^/]+)\/?$/;

function App() {
  const [page, setPage] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    if (p.get('checkout')) return 'tickets';
    if (window.location.pathname === '/buy' || QR_PATH.test(window.location.pathname)) return 'events';
    return 'home';
  });
  const [user, setUser] = useState(() => window.RNTECH_AUTH.getUser());
  const [authModal, setAuthModal] = useState(null);
  const [authEmail, setAuthEmail] = useState('');
  const [showProfile, setShowProfile] = useState(false);
  const [resetToken, setResetToken] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    return p.get('reset') || null;
  });
  const [inviteToken, setInviteToken] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    return p.get('invite') || null;
  });
  const [offerToken, setOfferToken] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    return p.get('offer') || null;
  });
  const [promoCode] = useState(() => {
    const m = window.location.pathname.match(QR_PATH);
    return m ? decodeURIComponent(m[1]).toLowerCase() : null;
  });
  const [checkoutInfo] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    const status = p.get('checkout');
    if (!status) return null;
    return { status, orderId: p.get('order') || null };
  });

  const [pendingEventIntent, setPendingEventIntent] = useState(() => {
    const path = window.location.pathname;
    return path === '/buy' || QR_PATH.test(path) ? { eventId: 'featured', action: 'ticket' } : null;
  }); // { eventId, action: 'ticket'|'detail' } — 'featured' resolves to the current featured event

  // Strip one-shot query params (invite/checkout/reset) and the /buy path from the URL after reading them
  useEffect(() => {
    if (inviteToken || offerToken || checkoutInfo || resetToken || pendingEventIntent) {
      window.history.replaceState({}, '', '/');
    }
  }, []);
  const [currentMix, setCurrentMix] = useState(null);
  const [showAdmin, setShowAdmin] = useState(false);
  const [showVideoModal, setShowVideoModal] = useState(false);
  const videoRef = useRef(document.getElementById('bg-video'));

  // Restore session on load
  useEffect(() => {
    const token = window.RNTECH_AUTH.getToken();
    if (token && !user) {
      window.RNTECH_API.me().then(u => {
        window.RNTECH_AUTH.setUser(u);
        setUser(u);
      }).catch(() => { window.RNTECH_AUTH.logout(); });
    }
  }, []);

  // Play a mix — sets src on persistent video element
  const handlePlayMix = useCallback((mix) => {
    const vid = videoRef.current;
    if (!vid) return;

    if (currentMix && currentMix.id === mix.id) {
      // Toggle play/pause
      if (vid.paused) vid.play();
      else vid.pause();
      return;
    }

    setCurrentMix(mix);
    setShowVideoModal(false);

    if (mix.videoSrc) {
      vid.src = mix.videoSrc;
      vid.load();
      vid.play().catch(() => {});
    }

    // Media Session API — lock screen + notification controls
    if ('mediaSession' in navigator) {
      navigator.mediaSession.metadata = new MediaMetadata({
        title: mix.title,
        artist: mix.residentName,
        album: 'RNTECH',
        artwork: mix.coverImage ? [{ src: mix.coverImage, sizes: '512x512', type: 'image/jpeg' }] : [],
      });
      navigator.mediaSession.setActionHandler('play',  () => vid.play());
      navigator.mediaSession.setActionHandler('pause', () => vid.pause());
      navigator.mediaSession.setActionHandler('stop',  () => { vid.pause(); setCurrentMix(null); });
      navigator.mediaSession.setActionHandler('seekto', (d) => { if (d.seekTime !== undefined) vid.currentTime = d.seekTime; });
    }
  }, [currentMix]);

  const handleCloseMix = useCallback(() => {
    const vid = videoRef.current;
    if (vid) { vid.pause(); vid.src = ''; }
    setCurrentMix(null);
    setShowVideoModal(false);
  }, []);

  const onAuth = useCallback((mode, email) => { setAuthModal(mode); setAuthEmail(email || ''); }, []);
  const onAuthSuccess = useCallback((u) => { setUser(u); setAuthModal(null); }, []);
  const onLogout = useCallback(() => { window.RNTECH_AUTH.logout(); setUser(null); }, []);
  const onProfileSaved = useCallback((u) => { setUser(u); }, []);
  const onNavigate = useCallback((p, intent) => {
    setPage(p); setShowAdmin(false); window.scrollTo(0, 0);
    if (intent) setPendingEventIntent(intent);
  }, []);

  const activePage = showAdmin ? 'admin' : page;

  const renderPage = () => {
    const props = { user, onAuth, onLogin: onAuthSuccess, onNavigate, onPlayMix: handlePlayMix, currentMix };
    switch (activePage) {
      case 'home':    return React.createElement(PageHome, props);
      case 'events':  return React.createElement(PageEvents, { ...props, pendingEventIntent, promoCode, onConsumeEventIntent: () => setPendingEventIntent(null) });
      case 'mixes':   return React.createElement(PageMixes, props);
      case 'tickets': return React.createElement(PageTickets, { ...props, checkoutInfo });
      case 'contact': return React.createElement(PageContact, props);
      case 'admin':   return React.createElement(PageAdmin, { user });
      default:        return React.createElement(PageHome, props);
    }
  };

  return React.createElement('div', null,
    React.createElement(StarField),

    // Desktop Nav
    React.createElement('nav', null,
      React.createElement('div', { className: 'nav-logo', onClick: () => { setPage('home'); setShowAdmin(false); } },
        React.createElement('img', { src: '/static/uploads/logo-transparent.png', alt: 'RNTECH' })
      ),
      React.createElement('div', { className: 'nav-links' },
        NAV_ITEMS.map(item =>
          React.createElement('button', {
            key: item.id,
            className: 'nav-link' + (page === item.id && !showAdmin ? ' active' : ''),
            onClick: () => onNavigate(item.id)
          }, item.label)
        ),
        user && user.role === 'admin' &&
          React.createElement('button', {
            className: 'nav-link' + (showAdmin ? ' active' : ''),
            onClick: () => setShowAdmin(s => !s)
          }, 'Admin')
      ),
      React.createElement('div', { className: 'nav-right' },
        user ? React.createElement('div', { className: 'nav-user-badge' },
          React.createElement('div', { className: 'nav-user-dot' }),
          React.createElement('button', {
            onClick: () => setShowProfile(true),
            style: { background:'none',border:'none',cursor:'pointer',fontFamily:"'Space Grotesk',sans-serif",color:'rgba(255,255,255,0.7)',fontSize:13,fontWeight:600,padding:'4px 6px',textDecoration:'underline',textDecorationColor:'rgba(50,114,168,0.5)' },
            title: 'Edit profile'
          }, user.name.split(' ')[0]),
          React.createElement('button', {
            onClick: onLogout,
            style: { background:'none',border:'1px solid rgba(255,255,255,0.15)',borderRadius:0,color:'rgba(255,255,255,0.4)',cursor:'pointer',padding:'6px 12px',fontSize:12,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase' }
          }, 'Sign Out')
        ) : React.createElement('div', { style: { display: 'flex', gap: 8 } },
          React.createElement('button', {
            onClick: () => onAuth('login'),
            style: { background:'none',border:'1px solid rgba(255,255,255,0.15)',borderRadius:0,color:'rgba(255,255,255,0.7)',cursor:'pointer',padding:'8px 16px',fontSize:13,fontWeight:600,letterSpacing:'0.05em',textTransform:'uppercase' }
          }, 'Sign In'),
          React.createElement('button', {
            onClick: () => onAuth('register'),
            style: { background:'#3272a8',border:'none',borderRadius:0,color:'#fff',cursor:'pointer',padding:'8px 16px',fontSize:13,fontWeight:700,letterSpacing:'0.05em',textTransform:'uppercase',boxShadow:'0 0 16px rgba(50,114,168,0.4)' }
          }, 'Join')
        )
      )
    ),

    // Page content
    React.createElement('main', { className: 'page-enter', key: activePage, style: { position: 'relative', zIndex: 1 } },
      renderPage()
    ),

    // Mobile Nav
    React.createElement('div', { className: 'mobile-nav' },
      React.createElement('div', { className: 'mobile-nav-inner' },
        NAV_ITEMS.map(item =>
          React.createElement('button', {
            key: item.id,
            className: 'mobile-nav-item' + (page === item.id && !showAdmin ? ' active' : ''),
            onClick: () => onNavigate(item.id)
          },
            React.createElement('span', { className: 'icon' }, item.icon),
            item.label
          )
        ),
        user && user.role === 'admin' &&
          React.createElement('button', {
            className: 'mobile-nav-item' + (showAdmin ? ' active' : ''),
            onClick: () => setShowAdmin(s => !s)
          },
            React.createElement('span', { className: 'icon' }, '⚙'),
            'Admin'
          )
      )
    ),

    // Auth Modal
    authModal && React.createElement(AuthModal, { mode: authModal, initialEmail: authEmail, onClose: () => setAuthModal(null), onSuccess: onAuthSuccess }),

    // Profile Modal
    showProfile && user && React.createElement(ProfileModal, { user, onClose: () => setShowProfile(false), onSaved: onProfileSaved }),

    // Password Reset Modal (triggered by ?reset=TOKEN in URL)
    resetToken && React.createElement(ResetPasswordModal, {
      token: resetToken,
      onClose: () => { setResetToken(null); window.history.replaceState({}, '', '/'); },
      onSuccess: () => { setResetToken(null); window.history.replaceState({}, '', '/'); setAuthModal('login'); },
    }),

    // Waitlist "invite to buy" modal (triggered by ?invite=TOKEN in URL)
    inviteToken && React.createElement(InviteModal, {
      token: inviteToken,
      onClose: () => setInviteToken(null),
    }),

    // Personal discount link (?offer=TOKEN) — one person, one use
    offerToken && React.createElement(OfferModal, {
      token: offerToken,
      onClose: () => setOfferToken(null),
    }),

    // Mini Player
    currentMix && React.createElement(MiniPlayer, {
      mix: currentMix,
      videoRef,
      onClose: handleCloseMix,
      onWatch: () => setShowVideoModal(true),
    }),

    // Video Modal (video element moves here when open)
    showVideoModal && currentMix && React.createElement(VideoModal, {
      mix: currentMix,
      videoRef,
      onClose: () => setShowVideoModal(false),
    }),

    // Move video element into modal slot when open
    showVideoModal && currentMix && React.createElement(VideoPortal, { videoRef })
  );
}

// Moves the persistent <video> element into the modal slot
function VideoPortal({ videoRef }) {
  useEffect(() => {
    const slot = document.getElementById('video-modal-slot');
    const vid = videoRef.current;
    if (!slot || !vid) return;
    vid.style.cssText = 'position:static;width:100%;height:100%;object-fit:contain;top:auto;left:auto;opacity:1;';
    slot.innerHTML = '';
    slot.appendChild(vid);
    return () => {
      // Return to bg position on unmount
      vid.style.cssText = 'position:fixed;top:-9999px;left:-9999px;width:1px;height:1px;opacity:0;pointer-events:none;';
      document.body.appendChild(vid);
    };
  }, [videoRef]);
  return null;
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(App));
</script>
</body>
</html>
