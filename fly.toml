app = "rntech"
primary_region = "lhr"

[build]

[env]
  DATA_DIR = "/app/data"
  UPLOAD_DIR = "/app/uploads"
  FRONTEND_DIR = "/app/frontend"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

  [http_service.concurrency]
    type = "connections"
    hard_limit = 25
    soft_limit = 20

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1

[[mounts]]
  source = "rntech_data"
  destination = "/app/data"
  initial_size = "1gb"

[[mounts]]
  source = "rntech_uploads"
  destination = "/app/uploads"
  initial_size = "3gb"
